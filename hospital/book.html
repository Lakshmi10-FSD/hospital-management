<!DOCTYPE html>
<html>
<head>
  <title>Book Appointment</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">
<!-- ✅ NAVBAR -->
<nav class="bg-green-600 text-white p-4 shadow-md">
  <div class="flex justify-between items-center">
    
    <h1 class="font-bold text-lg">🏥 MediCare</h1>

    <!-- DESKTOP -->
    <div class="hidden md:flex space-x-6 font-medium">
      <a href="index.html" class="underline">Home</a>
      <a href="book.html" class="hover:underline">Book</a>
      <a href="appoinments.html" class="hover:underline">Appointments</a>
    </div>

    <!-- MOBILE -->
    <button id="menuBtn" class="md:hidden text-2xl">☰</button>
  </div>

  <div id="mobileMenu" class="hidden flex-col mt-4 space-y-2 md:hidden">
    <a href="index.html" class="block bg-green-500 p-2 rounded">Home</a>
    <a href="book.html" class="block bg-green-500 p-2 rounded">Book</a>
    <a href="appoinments.html" class="block bg-green-500 p-2 rounded">Appointments</a>
  </div>
</nav>

<div class="max-w-xl mx-auto bg-white p-6 mt-10 rounded-xl shadow-lg">

  <h2 class="text-xl font-semibold mb-4">📅 Book Appointment</h2>

  <p id="message" class="text-center mb-3 text-sm"></p>

  <input id="name" type="text" placeholder="Enter Name"
    class="w-full border p-2 rounded mb-3">

  <select id="doctor" class="w-full border p-2 rounded mb-3">
    <option value="">Select Doctor</option>
    <option>Dr. Ravi</option>
    <option>Dr. Priya</option>
    <option>Dr. Kumar</option>
  </select>

  <input id="date" type="date" class="w-full border p-2 rounded mb-3">
  <input id="time" type="time" class="w-full border p-2 rounded mb-3">

  <button onclick="bookAppointment()"
    class="w-full mt-4 bg-green-500 text-white p-2 rounded">
    Book Appointment
  </button>
</div>

<script>
function bookAppointment() {
  let name = document.getElementById("name").value;
  let doctor = document.getElementById("doctor").value;
  let date = document.getElementById("date").value;
  let time = document.getElementById("time").value;

  if (!name || !doctor || !date || !time) {
    alert("Fill all fields");
    return;
  }

  let appointments = JSON.parse(localStorage.getItem("appointments")) || [];

  appointments.push({ name, doctor, date, time });

  localStorage.setItem("appointments", JSON.stringify(appointments));

  alert("Appointment Booked!");

  // 👉 Direct redirect
  window.location.href = "appointments.html";
}
</script>

</body>
</html>
