<!DOCTYPE html>
<html>
<head>
  <title>Book Appointment</title>
  <script src="https://cdn.tailwindcss.com"></script> 
</head> 
 
<body class="bg-gray-100 min-h-screen"> 
 
<!-- ✅ NAVBAR (UPDATED) -->
<nav class="bg-green-600 text-white p-4">
  <div class="flex justify-between items-center">
    
    <h1 class="font-bold text-lg">🏥 MediCare</h1>

    <!-- DESKTOP MENU -->
    <div class="hidden md:flex space-x-4">
      <a href="index.html">Home</a>
      <a href="book.html">Book</a>
      <a href="appointments.html">Appointments</a>
    </div>

    <!-- MOBILE BUTTON -->
    <button id="menuBtn" class="md:hidden text-2xl">☰</button>
  </div>

  <!-- MOBILE MENU -->
  <div id="mobileMenu" class="hidden flex-col mt-4 space-y-2 md:hidden">
    <a href="index.html" class="block bg-green-500 p-2 rounded">Home</a>
    <a href="book.html" class="block bg-green-500 p-2 rounded">Book</a>
    <a href="appointments.html" class="block bg-green-500 p-2 rounded">Appointments</a>
  </div>
</nav>
 
<!-- FORM --> 
<div class="max-w-xl mx-auto bg-white p-6 mt-10 rounded shadow"> 
   
  <input id="name" type="text" placeholder="Enter Name" 
    class="w-full border p-2 rounded mb-3"> 
 
  <select id="doctor" class="w-full border p-2 rounded mb-3"> 
    <option value="">Select Doctor</option> 
    <option>Dr. Ravi - Cardiologist</option> 
    <option>Dr. Priya - Dentist</option> 
    <option>Dr. Kumar - Dermatologist</option> 
  </select> 
 
  <div class="flex flex-col md:flex-row gap-3"> 
    <input id="date" type="date" class="w-full border p-2 rounded"> 
    <input id="time" type="time" class="w-full border p-2 rounded"> 
  </div> 
 
  <button onclick="bookAppointment()" 
    class="w-full mt-4 bg-green-500 text-white p-2 rounded"> 
    Book Appointment 
  </button> 
</div> 
 <script>
function bookAppointment() { 
  const name = document.getElementById("name").value; 
  const doctor = document.getElementById("doctor").value; 
  const date = document.getElementById("date").value; 
  const time = document.getElementById("time").value; 

  if (!name || !doctor || !date || !time) { 
    alert("Please fill all fields!"); 
    return; 
  } 

  let appointments = JSON.parse(localStorage.getItem("appointments")) || [];

  const exists = appointments.find(app => 
    app.doctor === doctor && 
    app.date === date && 
    app.time === time 
  ); 

  if (exists) { 
    alert("❌ Slot already booked!"); 
    return; 
  } 

  appointments.push({ name, doctor, date, time }); 
  localStorage.setItem("appointments", JSON.stringify(appointments)); 

  alert("✅ Appointment Booked!"); 

  // ✅ FINAL WORKING REDIRECT
  window.location.href = "./appointments.html";
}
</script>
</body>
</html>
