<!DOCTYPE html>
<html>
<head>
  <title>Appointments</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">
<!-- ✅ NAVBAR -->
<nav class="bg-green-600 text-white p-4 shadow-md">
  <div class="flex justify-between items-center">
    
    <h1 class="font-bold text-lg">🏥 MediCare</h1>

    <!-- DESKTOP -->
    <div class="hidden md:flex space-x-6 font-medium">
      <a href="index.html" class="underline">Home</a>
      <a href="book.html" class="hover:underline">Book</a>
      <a href="appoinments.html" class="hover:underline">Appointments</a>
    </div>

    <!-- MOBILE -->
    <button id="menuBtn" class="md:hidden text-2xl">☰</button>
  </div>

  <div id="mobileMenu" class="hidden flex-col mt-4 space-y-2 md:hidden">
    <a href="index.html" class="block bg-green-500 p-2 rounded">Home</a>
    <a href="book.html" class="block bg-green-500 p-2 rounded">Book</a>
    <a href="appoinments.html" class="block bg-green-500 p-2 rounded">Appointments</a>
  </div>
</nav>

<div class="max-w-5xl mx-auto mt-10 bg-white p-6 rounded-xl shadow-lg">

  <h2 class="text-2xl font-semibold mb-4">📋 Appointments</h2>

  <table class="w-full text-center border">
    <thead class="bg-green-500 text-white">
      <tr>
        <th class="p-3">Name</th>
        <th class="p-3">Doctor</th>
        <th class="p-3">Date</th>
        <th class="p-3">Time</th>
        <th class="p-3">Action</th>
      </tr>
    </thead>

    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
function getAppointments() {
  return JSON.parse(localStorage.getItem("appointments")) || [];
}

function displayAppointments() {
  let tableBody = document.getElementById("tableBody");
  let data = getAppointments();

  tableBody.innerHTML = "";

  if (data.length === 0) {
    tableBody.innerHTML = `
      <tr>
        <td colspan="5">No Appointments</td>
      </tr>
    `;
    return;
  }

  data.forEach((item, index) => {
    tableBody.innerHTML += `
      <tr>
        <td>${item.name}</td>
        <td>${item.doctor}</td>
        <td>${item.date}</td>
        <td>${item.time}</td>
        <td>
          <button onclick="deleteData(${index})"
            class="bg-red-500 text-white px-2 py-1 rounded">
            Delete
          </button>
        </td>
      </tr>
    `;
  });
}

function deleteData(index) {
  let data = getAppointments();
  data.splice(index, 1);
  localStorage.setItem("appointments", JSON.stringify(data));
  displayAppointments();
}

displayAppointments();
</script>

</body>
</html>
